course-code: "EC7422"
course-name: "Data Science for Economic Analysis"
institution: "Stockholm University"
author-email: "adam.altmejd@su.se"

format:
  datascience-theme-revealjs:
    slide-level: 2
    auto-stretch: true
    output-location: column
    menu:
      side: left
    mermaid:
      theme: forest
    html-math-method:
      method: mathjax
      url: "https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js"
    include-before-body:
      - text: |
          <script>
          window.MathJax = {
            tex: {
              inlineMath: [['\\(', '\\)']],
              displayMath: [['\\[', '\\]']],
              processEscapes: true,
              processRefs: true,
              processEnvironments: true
            },
            chtml: {
              font: 'mathjax-asana'
            },
            startup: {
              ready: () => {
                MathJax.startup.defaultReady();
              }
            }
          };
          </script>
    include-after-body:
      - text: |
          <script>
          if (location.search.includes('handout')) {
            document.body.classList.add('handout');
            function stackNotes(slide) {
              const note = slide.querySelector(':scope > aside.notes');
              const aside = slide.querySelector(':scope > aside:not(.notes)');
              if (note && aside) {
                requestAnimationFrame(() => {
                  aside.style.bottom = (note.offsetHeight + 8) + 'px';
                });
              }
            }
            Reveal.on('slidechanged', e => stackNotes(e.currentSlide));
            Reveal.on('ready', e => stackNotes(e.currentSlide));
          }
          </script>
    filters:
      - reveal-auto-agenda
    revealjs-plugins:
      - attribution
