course-code: "EC7422"
course-name: "Data Science for Economic Analysis"
institution: "Stockholm University"
author-email: "adam.altmejd@su.se"

format:
  datascience-theme-revealjs:
    embed-resources: true
    slide-level: 2
    auto-stretch: true
    output-location: column
    menu:
      side: left
    mermaid:
      theme: forest
    html-math-method:
      method: mathjax
      url: "https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js"
    include-before-body:
      - text: |
          <script>
          window.MathJax = {
            tex: {
              inlineMath: [['\\(', '\\)']],
              displayMath: [['\\[', '\\]']],
              processEscapes: true,
              processRefs: true,
              processEnvironments: true
            },
            chtml: {
              font: 'mathjax-asana'
            },
            startup: {
              ready: () => {
                MathJax.startup.defaultReady();
              }
            }
          };
          </script>
    filters:
      - reveal-auto-agenda
    revealjs-plugins:
      - attribution
