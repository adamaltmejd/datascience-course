name: Publish Course Material

on:
  push:
    branches:
      - main
    paths:
      - lectures/**
      - problem_sets/**
      - _quarto.yml
      - _extensions/**
      - .github/workflows/publish-course-material.yml
      - .github/scripts/render_revealjs_handouts.py
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      html: ${{ steps.filter.outputs.html }}
      publishable: ${{ steps.filter.outputs.publishable }}
      source: ${{ steps.filter.outputs.source }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect publish inputs
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            html:
              - 'lectures/**/*.html'
              - 'problem_sets/**/*.html'
            publishable:
              - 'lectures/**'
              - 'problem_sets/**'
            source:
              - '_quarto.yml'
              - '_extensions/**'
              - 'lectures/**/*.qmd'
              - 'lectures/_metadata.yml'
              - 'lectures/custom.scss'
              - 'problem_sets/**/*.qmd'
              - 'problem_sets/_metadata.yml'
              - 'problem_sets/custom.scss'

  validate-rendered-html:
    needs: detect-changes
    if: needs.detect-changes.outputs.source == 'true' && needs.detect-changes.outputs.html != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Fail when rendered HTML was not committed
        run: |
          echo "Source files changed without updated rendered HTML."
          echo "Run Quarto locally, commit the resulting HTML, then push again."
          exit 1

  build:
    needs:
      - detect-changes
      - validate-rendered-html
    if: always() && needs.validate-rendered-html.result != 'failure'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Assemble publishable site
        run: |
          mkdir -p _site
          rsync -a lectures/ _site/lectures/
          rsync -a problem_sets/ _site/problem_sets/

      - name: Install Chromium for Playwright
        run: uv run --with playwright python -m playwright install --with-deps chromium

      - name: Generate revealjs handout PDFs
        run: |
          python -m http.server 8000 --bind 127.0.0.1 --directory _site >/tmp/handout-server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          uv run --with playwright python .github/scripts/render_revealjs_handouts.py \
            --site-dir _site \
            --base-url http://127.0.0.1:8000

      - name: Prevent Jekyll processing
        run: touch _site/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
