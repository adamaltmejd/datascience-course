name: Publish Course Material

on:
  push:
    branches:
      - main
    paths:
      - .Rprofile
      - .github/scripts/render_revealjs_handouts.py
      - .github/workflows/publish-course-material.yml
      - _extensions/**
      - _quarto.yml
      - datascience-course.bib
      - index.qmd
      - lectures/**
      - problem_sets/**
      - rproject.toml
      - rv.lock
      - rv/scripts/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  QUARTO_VERSION: "1.9.36"
  DECKTAPE_VERSION: "3.15.0"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: ${{ env.QUARTO_VERSION }}

      - name: Read R version from rproject.toml
        id: rproject
        run: |
          r_version=$(sed -nE 's/^r_version[[:space:]]*=[[:space:]]*"([0-9.]+)".*/\1/p' rproject.toml)
          echo "r_version=$r_version" >> "$GITHUB_OUTPUT"

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ steps.rproject.outputs.r_version }}

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            gsfonts \
            libcairo2-dev \
            libcurl4-openssl-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            librsvg2-dev

      - name: Install rv
        run: |
          curl -sSL https://raw.githubusercontent.com/A2-ai/rv/refs/heads/main/scripts/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Swap the CRAN repo for PPM's Linux binaries on CI. rproject.toml keeps
      # cloud.r-project.org for macOS, where PPM's binary mirror is unreliable.
      - name: Use PPM Linux binaries for rv
        run: rv configure repository replace CRAN --url 'https://packagemanager.posit.co/cran/__linux__/noble/latest'

      - name: Cache rv library
        uses: actions/cache@v4
        with:
          path: rv/library
          key: rv-library-${{ runner.os }}-R${{ steps.rproject.outputs.r_version }}-ppm-${{ hashFiles('rv.lock') }}
          restore-keys: |
            rv-library-${{ runner.os }}-R${{ steps.rproject.outputs.r_version }}-ppm-

      - name: Sync rv library
        run: rv sync

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.3"
          enable-cache: true
          cache-dependency-glob: |
            .github/workflows/publish-course-material.yml
            .github/scripts/render_revealjs_handouts.py

      - name: Render Quarto project
        run: quarto render

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install decktape
        run: npm install -g "decktape@${DECKTAPE_VERSION}"

      - name: Restore cached handout PDFs
        uses: actions/cache@v4
        with:
          path: |
            _site/lectures/**/lecture_*.pdf
            .pdf_hashes.json
          key: handout-pdfs-${{ hashFiles('_site/lectures/**/lecture_*.html') }}
          restore-keys: handout-pdfs-

      - name: Generate revealjs handout PDFs
        run: |
          python -m http.server 8000 --bind 127.0.0.1 --directory _site >/tmp/handout-server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/ >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:8000/ >/dev/null
          python .github/scripts/render_revealjs_handouts.py \
            --site-dir _site \
            --base-url http://127.0.0.1:8000

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
