name: Publish Course Material

on:
  push:
    branches:
      - main
    paths:
      - lectures/**
      - problem_sets/**
      - _quarto.yml
      - _extensions/**
      - renv.lock
      - renv/**
      - datascience-course.bib
      - .github/workflows/publish-course-material.yml
      - .github/scripts/render_revealjs_handouts.py
      - "!lectures/**/*.html"
      - "!problem_sets/**/*.html"
      - "!lectures/**/*.pdf"
      - "!problem_sets/**/*.pdf"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  RENV_CONFIG_REPOS_OVERRIDE: CRAN=https://packagemanager.posit.co/cran/latest

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: renv
          use-public-rspm: true

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            gdal-bin \
            gsfonts \
            libcairo2-dev \
            libcurl4-openssl-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libgdal-dev \
            libmagick++-dev \
            libpng-dev \
            libudunits2-dev \
            libx11-dev \
            pandoc

      - name: Restore renv library
        uses: r-lib/actions/setup-renv@v2
        with:
          cache-version: 3

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: |
            .github/workflows/publish-course-material.yml
            .github/scripts/render_revealjs_handouts.py

      - name: Render Quarto project
        run: quarto render --output-dir _site

      - name: Install Chromium for Playwright
        run: uv run --with playwright python -m playwright install --with-deps chromium

      - name: Generate revealjs handout PDFs
        run: |
          python -m http.server 8000 --bind 127.0.0.1 --directory _site >/tmp/handout-server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          uv run --with playwright python .github/scripts/render_revealjs_handouts.py \
            --site-dir _site \
            --base-url http://127.0.0.1:8000

      - name: Prevent Jekyll processing
        run: touch _site/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: always() && needs.build.result == 'success'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
